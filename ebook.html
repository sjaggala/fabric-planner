<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Fabric Field Guide — a DP-600 eBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF1F4; --chip:#F7F9FB;
  --ink:#13161B; --ink-2:#586070; --ink-3:#8A91A0;
  --line:#E2E6EB; --line-2:#D2D8E0;
  --gold:#B9791A; --gold-soft:#F5E9D2; --gold-ink:#7A5010;
  --p1:#0E8C6F; --p1-soft:#DCF1EB; --p1-ink:#0A5D4A;
  --p2:#5B53C6; --p2-soft:#E6E4FA; --p2-ink:#3A338F;
  --p3:#C2522E; --p3-soft:#F7E3DB; --p3-ink:#8C381E;
  --p4:#3A6CA6; --p4-soft:#E0EAF5; --p4-ink:#274C76;
  --def:#1E6FB8; --def-soft:#E3EFFA;
  --key:#0E8C6F; --key-soft:#DCF1EB;
  --exam:#B03A4A; --exam-soft:#F8E3E6;
  --scn:#9A6711; --scn-soft:#F6ECD7;
  --warn:#B06A12; --warn-soft:#FaeCd6;
  --code-bg:#11151C; --code-ink:#D6DEE8; --code-cm:#7C8AA0;
  --radius:14px; --radius-sm:9px;
  --display:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sidebar-w:296px; --toc-w:224px; --header-h:60px;
}
html[data-theme="dark"]{
  --bg:#0F1216; --surface:#171B21; --surface-2:#1E242C; --chip:#1B2028;
  --ink:#E8ECF1; --ink-2:#A6AEBB; --ink-3:#6F7885;
  --line:#282F38; --line-2:#333B45;
  --gold:#E0A94A; --gold-soft:#3A2E17; --gold-ink:#F0C87E;
  --p1:#3FC7A3; --p1-soft:#123029; --p1-ink:#7FE0C6;
  --p2:#9A93EE; --p2-soft:#211E42; --p2-ink:#B9B3F6;
  --p3:#E88A66; --p3-soft:#3A211630; --p3-ink:#F2A985;
  --p4:#6FA4DE; --p4-soft:#16263A; --p4-ink:#9CC2EC;
  --def:#5AA6E8; --def-soft:#132638;
  --key:#3FC7A3; --key-soft:#123029;
  --exam:#EA7C8B; --exam-soft:#361A20;
  --scn:#E0A94A; --scn-soft:#312613;
  --warn:#E0A94A; --warn-soft:#312613;
  --code-bg:#0B0E13; --code-ink:#CBD5E1; --code-cm:#6B7688;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--body);font-size:15.5px;line-height:1.68;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--def);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:60;height:var(--header-h);
  background:color-mix(in srgb,var(--bg) 86%,transparent);
  backdrop-filter:saturate(160%) blur(10px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 18px;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;
  font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-.5px;
}
.brand h1{font-family:var(--display);font-weight:600;font-size:16px;margin:0;letter-spacing:-.3px;line-height:1.15}
.brand p{margin:0;font-size:11.5px;color:var(--ink-2);font-weight:450}
.brand .accent{color:var(--gold)}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.hbtn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);font-weight:500;font-size:13px;
  padding:7px 12px;border-radius:9px;transition:.15s;white-space:nowrap;
}
.hbtn:hover{border-color:var(--ink-3);color:var(--ink);text-decoration:none}
.hbtn .ic{font-size:14px;line-height:1}
.hbtn.ghost{border-color:transparent;background:transparent;padding:7px 9px}
.hbtn.ghost:hover{background:var(--surface-2)}
.navtoggle{display:none}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--toc-w);gap:0;
  max-width:1400px;margin:0 auto;align-items:start}
@media(max-width:1120px){:root{--toc-w:0px}.shell{grid-template-columns:var(--sidebar-w) minmax(0,1fr)}.toc-col{display:none}}
@media(max-width:860px){
  .shell{grid-template-columns:1fr}
  .side-col{position:fixed;inset:var(--header-h) auto 0 0;width:min(88vw,320px);z-index:55;
    transform:translateX(-102%);transition:transform .25s ease;box-shadow:0 0 40px rgba(0,0,0,.25)}
  html[data-nav="open"] .side-col{transform:none}
  .navtoggle{display:inline-flex}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:54;opacity:0;pointer-events:none;transition:.25s}
  html[data-nav="open"] .scrim{opacity:1;pointer-events:auto}
}

/* ---------- left sidebar ---------- */
.side-col{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));
  overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);
  padding:16px 12px 60px;scrollbar-width:thin}
.searchwrap{position:relative;margin-bottom:12px}
.searchwrap input{
  width:100%;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);
  border-radius:9px;padding:9px 11px 9px 32px;font-family:var(--body);font-size:13.5px;
}
.searchwrap input:focus{outline:none;border-color:var(--gold)}
.searchwrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.searchwrap .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:none;color:var(--ink-3);font-size:15px;display:none;padding:2px 5px;border-radius:6px}
.searchwrap .clr:hover{background:var(--surface-2)}

.progwrap{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.progwrap .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.progwrap .lab{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.progwrap .val{font-family:var(--display);font-weight:600;font-size:13px;color:var(--gold)}
.progwrap .track{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.progwrap .track i{display:block;height:100%;background:var(--gold);width:0;border-radius:4px;transition:width .5s}

.part{margin-top:14px}
.part:first-of-type{margin-top:2px}
.part-h{display:flex;align-items:center;gap:8px;padding:2px 6px 7px;font-family:var(--display);
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.part-h .pw{font-size:10px;color:var(--ink-3);font-weight:500;letter-spacing:.02em;text-transform:none}
.chap{margin-bottom:3px}
.chap-h{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;text-align:left;
  padding:8px 8px;border-radius:8px;color:var(--ink);transition:.13s}
.chap-h:hover{background:var(--surface-2)}
.chap-h .cn{width:22px;height:22px;flex-shrink:0;border-radius:7px;display:grid;place-items:center;
  font-family:var(--display);font-weight:600;font-size:11px;background:var(--pc-soft);color:var(--pc-ink)}
.chap-h .ct{flex:1;min-width:0;font-size:13.5px;font-weight:500;line-height:1.3}
.chap-h .cc{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.chap-h .cv{color:var(--ink-3);transition:transform .2s;font-size:11px;flex-shrink:0}
.chap.collapsed .cv{transform:rotate(-90deg)}
.chap.collapsed .seclist{display:none}
.seclist{list-style:none;margin:2px 0 6px;padding:0 0 0 6px;position:relative}
.seclist::before{content:"";position:absolute;left:14px;top:2px;bottom:6px;width:1.5px;background:var(--line)}
.seci{margin:0}
.seci button{display:flex;align-items:flex-start;gap:9px;width:100%;border:none;background:none;text-align:left;
  padding:6px 8px 6px 20px;border-radius:7px;color:var(--ink-2);transition:.12s;position:relative;line-height:1.35}
.seci button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.seci button:disabled{cursor:not-allowed;color:var(--ink-3)}
.seci .stat{position:absolute;left:0;top:7px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:10px;flex-shrink:0}
.seci .snum{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex-shrink:0;min-width:24px}
.seci .stt{font-size:13px;flex:1;min-width:0}
.seci.done .stat{background:var(--p1);color:#fff}
.seci.current .stat{background:var(--gold);color:#fff;box-shadow:0 0 0 3px var(--gold-soft)}
.seci.locked .stat{background:var(--surface-2);color:var(--ink-3)}
.seci.current button{color:var(--ink);font-weight:600;background:var(--gold-soft)}
html[data-theme="dark"] .seci.current button{background:color-mix(in srgb,var(--gold-soft) 70%,transparent)}
.seci.active button{box-shadow:inset 2px 0 0 var(--gold)}

/* ---------- center content ---------- */
.main-col{min-width:0;padding:30px 42px 100px}
@media(max-width:860px){.main-col{padding:22px 20px 80px}}
.crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);margin-bottom:14px}
.crumb .sep{opacity:.6}
.crumb .pill{background:var(--pc-soft);color:var(--pc-ink);padding:2px 9px;border-radius:20px;font-weight:600}
.doc{max-width:760px}
.doc .kicker{font-family:var(--display);font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:0 0 6px}
.doc h1{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.12;letter-spacing:-.6px;margin:0 0 14px}
@media(max-width:640px){.doc h1{font-size:27px}}
.doc .lede{font-size:18px;line-height:1.6;color:var(--ink-2);margin:0 0 26px;font-weight:450}
.doc h2{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.3px;margin:38px 0 12px;scroll-margin-top:76px;line-height:1.2}
.doc h2 .h2n{color:var(--ink-3);font-weight:500;font-size:16px;margin-right:8px;font-family:var(--mono)}
.doc h3{font-family:var(--display);font-weight:600;font-size:17px;margin:26px 0 8px;letter-spacing:-.2px}
.doc p{margin:0 0 15px}
.doc strong{font-weight:600;color:var(--ink)}
.doc em{color:var(--ink-2)}
.doc ul,.doc ol{margin:0 0 15px;padding-left:22px}
.doc li{margin:5px 0}
.doc li::marker{color:var(--ink-3)}
.doc code{font-family:var(--mono);font-size:.86em;background:var(--surface-2);padding:1.5px 5px;border-radius:5px;color:var(--ink)}
.doc a code{color:inherit}
.doc hr{border:none;border-top:1px solid var(--line);margin:30px 0}

/* callouts */
.cal{display:grid;grid-template-columns:auto 1fr;gap:12px;border-radius:11px;padding:14px 16px;margin:18px 0;
  border:1px solid var(--cc-line,var(--line));background:var(--cc-bg,var(--surface-2));font-size:14.5px;line-height:1.6}
.cal .cico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;
  background:var(--cc-ac,var(--ink-3));color:#fff}
.cal .cbody{min-width:0}
.cal .clab{font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--cc-ac,var(--ink-2));margin-bottom:3px}
.cal p:last-child{margin-bottom:0}
.cal.def{--cc-ac:var(--def);--cc-bg:var(--def-soft);--cc-line:color-mix(in srgb,var(--def) 26%,transparent)}
.cal.key{--cc-ac:var(--key);--cc-bg:var(--key-soft);--cc-line:color-mix(in srgb,var(--key) 26%,transparent)}
.cal.exam{--cc-ac:var(--exam);--cc-bg:var(--exam-soft);--cc-line:color-mix(in srgb,var(--exam) 26%,transparent)}
.cal.scn{--cc-ac:var(--scn);--cc-bg:var(--scn-soft);--cc-line:color-mix(in srgb,var(--scn) 26%,transparent)}
.cal.warn{--cc-ac:var(--warn);--cc-bg:var(--warn-soft);--cc-line:color-mix(in srgb,var(--warn) 30%,transparent)}

/* tables */
.tablewrap{overflow-x:auto;margin:18px 0;border:1px solid var(--line);border-radius:11px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
thead th{background:var(--surface-2);text-align:left;font-family:var(--display);font-weight:600;font-size:12.5px;
  color:var(--ink);padding:10px 13px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td strong{white-space:nowrap}

/* figures */
figure{margin:24px 0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:var(--surface)}
figure .figbox{padding:22px 20px;background:var(--chip);display:flex;justify-content:center}
figure svg{max-width:100%;height:auto}
figure img{max-width:100%;height:auto;display:block}
figcaption{padding:11px 16px;font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line);line-height:1.5}
figcaption b{color:var(--ink);font-weight:600}

/* code */
pre{font-family:var(--mono);font-size:12.5px;line-height:1.65;background:var(--code-bg);color:var(--code-ink);
  border-radius:10px;padding:14px 15px;overflow-x:auto;margin:14px 0}
pre .cm{color:var(--code-cm)}

/* references */
.refs{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
.refs h3{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.refs ol{padding-left:20px;font-size:13.5px;color:var(--ink-2)}
.refs li{margin:6px 0}

/* section footer nav */
.secfoot{max-width:760px;margin-top:40px;border-top:1px solid var(--line);padding-top:22px}
.complete-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.bigbtn{display:inline-flex;align-items:center;gap:9px;border:none;background:var(--gold);color:#fff;
  font-family:var(--display);font-weight:600;font-size:14.5px;padding:12px 20px;border-radius:11px;transition:.15s}
.bigbtn:hover{filter:brightness(1.06)}
.bigbtn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
.bigbtn.ghost:hover{border-color:var(--ink-3);filter:none}
.done-badge{display:inline-flex;align-items:center;gap:8px;color:var(--p1);font-weight:600;font-size:14px}
.done-badge .dot{width:22px;height:22px;border-radius:50%;background:var(--p1);color:#fff;display:grid;place-items:center;font-size:12px}
.prevnext{display:flex;gap:12px;flex-wrap:wrap}
.pncard{flex:1;min-width:200px;border:1px solid var(--line-2);border-radius:11px;padding:12px 15px;background:var(--surface);transition:.15s;text-align:left}
.pncard:hover:not(:disabled){border-color:var(--ink-3)}
.pncard:disabled{opacity:.45;cursor:not-allowed}
.pncard .k{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.pncard .t{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink);margin-top:3px;line-height:1.25}
.pncard.next{text-align:right}

/* locked / coming-soon placeholder */
.placeholder{max-width:620px;margin:40px auto;text-align:center;padding:40px 24px;
  border:1.5px dashed var(--line-2);border-radius:16px;background:var(--surface)}
.placeholder .pic{font-size:34px;margin-bottom:10px}
.placeholder h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 8px;border:none;padding:0}
.placeholder p{color:var(--ink-2);margin:0 auto 6px;max-width:440px}
.placeholder .snum{font-family:var(--mono);color:var(--gold);font-size:13px}

/* right TOC */
.toc-col{position:sticky;top:var(--header-h);height:calc(100vh - var(--header-h));overflow-y:auto;
  padding:34px 18px 60px 6px;scrollbar-width:thin}
.toc-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;padding-left:11px}
.toc-list{list-style:none;margin:0;padding:0;border-left:1.5px solid var(--line)}
.toc-list li a{display:block;padding:5px 11px;font-size:12.5px;color:var(--ink-3);border-left:1.5px solid transparent;margin-left:-1.5px;line-height:1.4}
.toc-list li a:hover{color:var(--ink);text-decoration:none}
.toc-list li a.on{color:var(--gold);border-left-color:var(--gold);font-weight:500}

.foot-note{max-width:760px;color:var(--ink-3);font-size:12px;margin-top:44px;line-height:1.6}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>

<header>
  <button class="hbtn ghost navtoggle" id="navToggle" aria-label="Open contents">☰</button>
  <div class="brand">
    <div class="logo">F8</div>
    <div>
      <h1>The Fabric Field Guide</h1>
      <p>A DP-600 companion eBook · <span class="accent">Microsoft Fabric</span></p>
    </div>
  </div>
  <div class="hdr-right">
    <a class="hbtn" href="index.html"><span class="ic">←</span><span class="lbltxt">Planner</span></a>
    <button class="hbtn ghost" id="themeBtn" aria-label="Toggle dark mode"><span class="ic" id="themeIco">◐</span></button>
  </div>
</header>

<div class="scrim" id="scrim"></div>

<div class="shell">
  <!-- LEFT: roadmap / contents -->
  <aside class="side-col" id="sideCol">
    <div class="searchwrap">
      <span class="si">⌕</span>
      <input type="search" id="searchBox" placeholder="Search the book…" autocomplete="off" aria-label="Search">
      <button class="clr" id="searchClr" aria-label="Clear search">×</button>
    </div>
    <div class="progwrap">
      <div class="top"><span class="lab">Your progress</span><span class="val" id="progVal">0 / 0</span></div>
      <div class="track"><i id="progBar"></i></div>
    </div>
    <nav id="toc"></nav>
  </aside>

  <!-- CENTER: active section -->
  <main class="main-col" id="mainCol">
    <div id="content"></div>
  </main>

  <!-- RIGHT: on this page -->
  <aside class="toc-col" id="tocCol">
    <div class="toc-h">On this page</div>
    <ul class="toc-list" id="onthispage"></ul>
  </aside>
</div>

<script>
(function(){
  "use strict";

  /* ============================================================
     BOOK OUTLINE — the full roadmap (Parts -> Chapters -> Sections)
     Adding content later = add a section here + an entry in CONTENT.
     ============================================================ */
  var BOOK = [
    {part:"I", title:"Foundations of Microsoft Fabric", weeks:"Weeks 1–2", phase:1, chapters:[
      {num:1, title:"The Fabric Platform", sections:[
        {id:"s1-1", num:"1.1", title:"What is Microsoft Fabric?"},
        {id:"s1-2", num:"1.2", title:"The Fabric workloads (experiences)"},
        {id:"s1-3", num:"1.3", title:"Tenants, capacities & SKUs"},
        {id:"s1-4", num:"1.4", title:"OneLake — the unified data lake"},
        {id:"s1-5", num:"1.5", title:"Shortcuts & data virtualization"}
      ]},
      {num:2, title:"Lakehouse, Delta Lake & the Medallion Architecture", sections:[
        {id:"s2-1", num:"2.1", title:"Lakehouse vs Warehouse"},
        {id:"s2-2", num:"2.2", title:"Delta Lake fundamentals"},
        {id:"s2-3", num:"2.3", title:"Table maintenance: OPTIMIZE, V-Order & VACUUM"},
        {id:"s2-4", num:"2.4", title:"The medallion architecture"},
        {id:"s2-5", num:"2.5", title:"Notebooks & Apache Spark orientation"}
      ]}
    ]},
    {part:"II", title:"Data Engineering", weeks:"Weeks 3–4", phase:2, chapters:[
      {num:3, title:"Transforming Data with PySpark", sections:[
        {id:"s3-1", num:"3.1", title:"The Spark DataFrame model & lazy evaluation"},
        {id:"s3-2", num:"3.2", title:"Core transformations"},
        {id:"s3-3", num:"3.3", title:"Writing to Lakehouse tables"},
        {id:"s3-4", num:"3.4", title:"Notebook patterns for production"}
      ]},
      {num:4, title:"Orchestration with Data Factory", sections:[
        {id:"s4-1", num:"4.1", title:"Pipelines, Dataflows & notebooks — choosing the tool"},
        {id:"s4-2", num:"4.2", title:"Building pipelines"},
        {id:"s4-3", num:"4.3", title:"Dataflows Gen2 & Power Query Online"},

  /* ============================================================
     CONTENT — authored sections (keyed by section id).
     Only ids present here have real content; the rest are
     roadmap stubs shown as "being written".
     ============================================================ */
  var CONTENT = {};
  CONTENT["s1-1"] = CONTENT_S1_1();

  /* ---------- flatten + phase palette ---------- */
  var PHASE_VARS = {1:["--p1-soft","--p1-ink","--p1"],2:["--p2-soft","--p2-ink","--p2"],3:["--p3-soft","--p3-ink","--p3"],4:["--p4-soft","--p4-ink","--p4"]};
  var FLAT=[]; var META={};
  BOOK.forEach(function(pt){pt.chapters.forEach(function(ch){ch.sections.forEach(function(s){
    var e={id:s.id,num:s.num,title:s.title,chap:ch,part:pt};
    META[s.id]=e; FLAT.push(e);
  });});});

  /* ---------- state ---------- */
  var LS_PROG="fabricEbookProgress_v1", LS_THEME="fabricEbookTheme_v1", LS_LAST="fabricEbookLast_v1", LS_COLLAPSE="fabricEbookCollapse_v1";
  var progress = load(LS_PROG) || {completed:{}};
  if(!progress.completed) progress.completed={};
  var collapsed = load(LS_COLLAPSE) || {};
  var activeId = null;

  function load(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function isDone(id){return !!progress.completed[id];}
  function idx(id){for(var i=0;i<FLAT.length;i++){if(FLAT[i].id===id)return i;}return -1;}
  function authored(id){return Object.prototype.hasOwnProperty.call(CONTENT,id);}

  // current index = number of leading completed sections (prefix semantics)
  function currentIndex(){
    var i=0; while(i<FLAT.length && isDone(FLAT[i].id)) i++; return i;
  }
  // accessible if completed, or it is the current (first not-done) section
  function accessible(id){var i=idx(id), c=currentIndex(); return i>=0 && i<=c;}

  /* ============================================================
     RENDER: left roadmap
     ============================================================ */
  function renderToc(){
    var toc=document.getElementById("toc"); toc.innerHTML="";
    var cur=currentIndex();
    BOOK.forEach(function(pt){
      var pv=PHASE_VARS[pt.phase];
      var pw=document.createElement("div"); pw.className="part";
      pw.innerHTML='<div class="part-h">Part '+pt.part+' · '+esc(pt.title)+' <span class="pw">'+esc(pt.weeks)+'</span></div>';
      pt.chapters.forEach(function(ch){
        var cw=document.createElement("div");
        cw.className="chap"+(collapsed["ch"+ch.num]?" collapsed":"");
        cw.style.setProperty("--pc-soft","var("+pv[0]+")");
        cw.style.setProperty("--pc-ink","var("+pv[1]+")");
        var totalC=ch.sections.length, doneC=ch.sections.filter(function(s){return isDone(s.id);}).length;
        var ch_h=document.createElement("button");
        ch_h.className="chap-h";
        ch_h.innerHTML='<span class="cn">'+ch.num+'</span><span class="ct">'+esc(ch.title)+'</span><span class="cc">'+doneC+'/'+totalC+'</span><span class="cv">▾</span>';
        ch_h.onclick=function(){cw.classList.toggle("collapsed");collapsed["ch"+ch.num]=cw.classList.contains("collapsed");save(LS_COLLAPSE,collapsed);};
        cw.appendChild(ch_h);
        var ul=document.createElement("ul"); ul.className="seclist";
        ch.sections.forEach(function(s){
          var i=idx(s.id);
          var state = isDone(s.id)?"done":(i===cur?"current":(i<cur?"done":"locked"));
          var acc = i<=cur;
          var li=document.createElement("li"); li.className="seci "+state+(s.id===activeId?" active":"");
          var statIco = state==="done"?"✓":(state==="current"?"●":"🔒");
          var b=document.createElement("button");
          b.disabled=!acc;
          b.setAttribute("data-id",s.id);
          b.innerHTML='<span class="stat">'+statIco+'</span><span class="snum">'+s.num+'</span><span class="stt">'+esc(s.title)+'</span>';
          if(acc) b.onclick=function(){openSection(s.id);closeNav();};
          else b.title="Complete the earlier sections to unlock this.";
          li.appendChild(b); ul.appendChild(li);
        });
        cw.appendChild(ul); pw.appendChild(cw);
      });
      toc.appendChild(pw);
    });
    // progress meter
    var doneN=FLAT.filter(function(e){return isDone(e.id);}).length;
    document.getElementById("progVal").textContent=doneN+" / "+FLAT.length;
    document.getElementById("progBar").style.width=Math.round(doneN/FLAT.length*100)+"%";
  }

  /* ============================================================
     RENDER: center section
     ============================================================ */
  function openSection(id){
    if(!accessible(id)) return;
    activeId=id; save(LS_LAST,id);
    var e=META[id]; var pv=PHASE_VARS[e.part.phase];
    var host=document.getElementById("content");
    var crumb='<div class="crumb" style="--pc-soft:var('+pv[0]+');--pc-ink:var('+pv[1]+')">'
      +'<span class="pill">Part '+e.part.part+'</span><span class="sep">›</span>'
      +'<span>Ch '+e.chap.num+' · '+esc(e.chap.title)+'</span><span class="sep">›</span>'
      +'<span>'+e.num+'</span></div>';

    if(authored(id)){
      host.innerHTML = crumb + '<article class="doc">'+CONTENT[id]+'</article>' + footerHTML(id);
      wireFooter(id);
    } else {
      host.innerHTML = crumb + comingSoonHTML(e);
    }
    renderToc();
    buildOnThisPage();
    document.getElementById("mainCol").scrollTop=0;
    window.scrollTo({top:0,behavior:"auto"});
  }

  function comingSoonHTML(e){
    return '<div class="placeholder"><div class="pic">✍️</div>'
      +'<div class="snum">Section '+e.num+'</div>'
      +'<h2>'+esc(e.title)+'</h2>'
      +'<p>This is your current section — the content is being written next. You have unlocked it by completing everything before it.</p>'
      +'<p style="color:var(--ink-3);font-size:13px">Come back after the next authoring session, or ask for it to be written now.</p></div>';
  }

  function footerHTML(id){
    var i=idx(id), done=isDone(id);
    var prev=i>0?FLAT[i-1]:null, next=i<FLAT.length-1?FLAT[i+1]:null;
    var completeRow;
    if(done){
      var on=progress.completed[id]; var whenTxt = (typeof on==="string")?("Completed "+on):"Completed";
      completeRow='<div class="complete-row"><span class="done-badge"><span class="dot">✓</span>'+whenTxt+'</span>'
        +'<button class="bigbtn ghost" data-uncomplete="'+id+'">Mark as not done</button></div>';
    } else {
      completeRow='<div class="complete-row"><button class="bigbtn" data-complete="'+id+'">Mark complete &amp; continue →</button>'
        +'<span style="color:var(--ink-3);font-size:13px">Finishing this unlocks the next section.</span></div>';
    }
    var pn='<div class="prevnext">';
    pn += prev
      ? '<button class="pncard prev" data-go="'+prev.id+'"><div class="k">← Previous</div><div class="t">'+prev.num+'  '+esc(prev.title)+'</div></button>'
      : '<button class="pncard prev" disabled><div class="k">← Previous</div><div class="t">Start of the book</div></button>';
    // next enabled only if it will be accessible (i.e., this one done -> next is current)
    var nextAcc = next && (isDone(next.id) || done);
    pn += next
      ? '<button class="pncard next" data-go="'+next.id+'" '+(nextAcc?'':'disabled')+'><div class="k">Next →</div><div class="t">'+next.num+'  '+esc(next.title)+'</div></button>'
      : '<button class="pncard next" disabled><div class="k">Next →</div><div class="t">End of the book</div></button>';
    pn+='</div>';
    return '<div class="secfoot">'+completeRow+pn+'</div>';
  }

  function wireFooter(id){
    var host=document.getElementById("content");
    var cb=host.querySelector("[data-complete]");
    if(cb) cb.onclick=function(){
      progress.completed[id]=new Date().toISOString().slice(0,10); save(LS_PROG,progress);
      var i=idx(id), next=i<FLAT.length-1?FLAT[i+1]:null;
      if(next) openSection(next.id); else openSection(id);
    };
    var uc=host.querySelector("[data-uncomplete]");
    if(uc) uc.onclick=function(){
      // only allow un-completing the last completed one to keep the prefix contiguous
      delete progress.completed[id];
      // also clear any completions after it (keep prefix valid)
      var i=idx(id);
      for(var j=i+1;j<FLAT.length;j++){ delete progress.completed[FLAT[j].id]; }
      save(LS_PROG,progress); openSection(id);
    };
    host.querySelectorAll("[data-go]").forEach(function(btn){
      if(btn.disabled) return;
      btn.onclick=function(){var t=btn.getAttribute("data-go"); if(accessible(t)) openSection(t);};
    });
  }

  /* ============================================================
     RIGHT: on this page (from h2s) + scrollspy
     ============================================================ */
  var spyEls=[];
  function buildOnThisPage(){
    var list=document.getElementById("onthispage"); list.innerHTML=""; spyEls=[];
    var heads=document.querySelectorAll("#content .doc h2");
    if(!heads.length){document.getElementById("tocCol").style.visibility="hidden";return;}
    document.getElementById("tocCol").style.visibility="visible";
    heads.forEach(function(h,n){
      if(!h.id) h.id="h_"+n;
      var label=h.getAttribute("data-toc")||h.textContent;
      var li=document.createElement("li");
      li.innerHTML='<a href="#'+h.id+'">'+esc(label)+'</a>';
      li.querySelector("a").onclick=function(ev){ev.preventDefault();document.getElementById(h.id).scrollIntoView({behavior:"smooth",block:"start"});};
      list.appendChild(li);
      spyEls.push({h:h,a:li.querySelector("a")});
    });
    onScroll();
  }
  function onScroll(){
    if(!spyEls.length) return;
    var top=window.scrollY+90, cur=spyEls[0];
    for(var i=0;i<spyEls.length;i++){ if(spyEls[i].h.offsetTop<=top) cur=spyEls[i]; }
    spyEls.forEach(function(s){s.a.classList.toggle("on",s===cur);});
  }
  window.addEventListener("scroll",onScroll,{passive:true});

  /* ============================================================
     SEARCH — titles across whole book + body of authored sections
     ============================================================ */
  var SEARCH_IDX=null;
  function buildSearchIndex(){
    SEARCH_IDX=FLAT.map(function(e){
      var body="";
      if(authored(e.id)){var tmp=document.createElement("div");tmp.innerHTML=CONTENT[e.id];body=(tmp.textContent||"").replace(/\s+/g," ");}
      return {id:e.id,num:e.num,title:e.title,chap:e.chap.title,body:body,hay:(e.num+" "+e.title+" "+e.chap.title+" "+body).toLowerCase()};
    });
  }
  function runSearch(q){
    q=q.trim().toLowerCase();
    var toc=document.getElementById("toc");
    if(!q){toc.style.display="";document.getElementById("searchResults")&&document.getElementById("searchResults").remove();document.getElementById("searchClr").style.display="none";return;}
    document.getElementById("searchClr").style.display="block";
    if(!SEARCH_IDX) buildSearchIndex();
    var terms=q.split(/\s+/).filter(Boolean);
    var hits=SEARCH_IDX.filter(function(r){return terms.every(function(t){return r.hay.indexOf(t)>=0;});});
    toc.style.display="none";
    var box=document.getElementById("searchResults");
    if(!box){box=document.createElement("div");box.id="searchResults";box.style.padding="2px 2px";toc.parentNode.appendChild(box);}
    if(!hits.length){box.innerHTML='<div style="color:var(--ink-3);font-size:13px;padding:10px">No matches for “'+esc(q)+'”.</div>';return;}
    box.innerHTML='<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;padding:6px 8px">'+hits.length+' result'+(hits.length>1?'s':'')+'</div>'+
      hits.map(function(r){
        var acc=accessible(r.id);
        var snip=snippet(r.body,terms);
        return '<button class="srch-hit" data-id="'+r.id+'" '+(acc?'':'disabled')+' style="display:block;width:100%;text-align:left;border:none;background:none;padding:9px 8px;border-radius:8px;cursor:'+(acc?'pointer':'not-allowed')+';color:var(--ink)">'
          +'<div style="font-size:13px;font-weight:600"><span style="font-family:var(--mono);color:var(--gold);font-size:11.5px;margin-right:6px">'+r.num+'</span>'+esc(r.title)+(acc?'':' <span style="font-size:10px;color:var(--ink-3)">🔒</span>')+'</div>'
          +(snip?'<div style="font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.4">'+snip+'</div>':'')+'</button>';
      }).join("");
    box.querySelectorAll(".srch-hit").forEach(function(b){
      if(b.disabled) return;
      b.onmouseenter=function(){b.style.background="var(--surface-2)";};
      b.onmouseleave=function(){b.style.background="none";};
      b.onclick=function(){openSection(b.getAttribute("data-id"));closeNav();};
    });
  }
  function snippet(body,terms){
    if(!body) return "";
    var low=body.toLowerCase(), pos=-1;
    for(var i=0;i<terms.length;i++){var p=low.indexOf(terms[i]);if(p>=0){pos=p;break;}}
    if(pos<0) return "";
    var start=Math.max(0,pos-30), txt=body.slice(start,start+90);
    txt=esc((start>0?"…":"")+txt+"…");
    terms.forEach(function(t){var re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");txt=txt.replace(re,"<mark style=\"background:var(--gold-soft);color:var(--gold-ink);padding:0 1px;border-radius:3px\">$1</mark>");});
    return txt;
  }

  /* ============================================================
     THEME + NAV wiring
     ============================================================ */
  function applyTheme(t){
    if(t==="dark"){document.documentElement.setAttribute("data-theme","dark");document.getElementById("themeIco").textContent="☀";}
    else{document.documentElement.removeAttribute("data-theme");document.getElementById("themeIco").textContent="◐";}
  }
  var theme=load(LS_THEME);
  if(theme==null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) theme="dark";
  applyTheme(theme);
  document.getElementById("themeBtn").onclick=function(){theme=(document.documentElement.getAttribute("data-theme")==="dark")?"light":"dark";applyTheme(theme);save(LS_THEME,theme);};

  function closeNav(){document.documentElement.removeAttribute("data-nav");}
  document.getElementById("navToggle").onclick=function(){document.documentElement.setAttribute("data-nav",document.documentElement.getAttribute("data-nav")==="open"?"closed":"open");};
  document.getElementById("scrim").onclick=closeNav;

  var sb=document.getElementById("searchBox");
  sb.addEventListener("input",function(){runSearch(sb.value);});
  document.getElementById("searchClr").onclick=function(){sb.value="";runSearch("");sb.focus();};

  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  /* ---------- init ---------- */
  renderToc();
  var last=load(LS_LAST);
  var startId=(last && accessible(last))?last:FLAT[0].id;
  openSection(startId);

  /* ============================================================
     ============  AUTHORED CONTENT BODIES  =====================
     ============================================================ */
  function CONTENT_S1_1(){ return [
  '<p class="kicker">Chapter 1 · The Fabric Platform</p>',
  '<h1>What is Microsoft Fabric?</h1>',
  '<p class="lede">Microsoft Fabric is a single software-as-a-service platform that folds every stage of analytics — moving data, engineering it, warehousing it, doing data science and real-time analytics on it, and building Power BI on top — into one product, over one shared lake, billed by one pool of capacity. This section is about the <em>shape</em> of that idea: what "SaaS analytics platform" really means, why Microsoft built it, and how it re-frames the Power BI world you already know.</p>',

  '<h2 data-toc="The problem it solves"><span class="h2n">1.1.1</span>From a toolbox of services to one product</h2>',
  '<p>Before Fabric, building an end-to-end analytics solution on Azure meant assembling a <strong>toolbox of separately-provisioned services</strong> and wiring them together yourself. A typical estate looked like this: an <strong>Azure Data Lake Storage (ADLS) Gen2</strong> account for raw files, <strong>Azure Data Factory</strong> to move and orchestrate data, <strong>Azure Synapse Analytics</strong> (or Databricks) for Spark and SQL warehousing, a <strong>Power BI</strong> workspace for reporting, plus the supporting cast — Key Vault for secrets, a managed identity or service principal for each hop, virtual networks, and an ARM/Bicep template to deploy it all.</p>',
  '<p>Every one of those boxes was a resource you sized, secured, patched, and paid for independently. The real cost was rarely any single service; it was the <strong>integration tax</strong> — the glue. Data was physically copied at each boundary (lake → warehouse → dataset), so the same sales table might exist in four places, each on its own refresh cadence, each able to drift out of sync. Security had to be re-declared at every layer because ADLS ACLs, Synapse SQL permissions, and Power BI RLS knew nothing about one another. And governance — "where did this number come from?" — meant tracing lineage by hand across products that didn\'t share a catalog.</p>',
  '<p>Fabric\'s founding bet is that most organizations don\'t actually want to <em>assemble a data platform</em> — they want to <em>use one</em>. So Fabric takes those capabilities and delivers them as <strong>experiences inside a single SaaS product</strong>, sitting on <strong>one logical data lake (OneLake)</strong>, governed and billed as a whole. You stop being the systems integrator.</p>',

  '<div class="cal scn"><div class="cico">🌍</div><div class="cbody"><div class="clab">Real-world scenario</div>',
  '<p>A mid-size retailer wants "yesterday\'s sales by store, in a Power BI report." On the classic stack that touches five provisioned resources and three data copies: Data Factory lands POS files in ADLS, a Synapse Spark job cleans them, a Synapse SQL pool models a star schema, a Power BI Import dataset copies it again and refreshes on a schedule, and someone maintains RLS separately in the dataset. In Fabric the <em>same</em> flow is a pipeline, a notebook, a Lakehouse, and a Direct Lake semantic model — all items in one workspace, all reading the one copy in OneLake, with no dataset refresh to schedule. Same conceptual pieces; none of the provisioning, and one copy of the data instead of four.</p></div></div>',

  '<h2 data-toc="What SaaS means here"><span class="h2n">1.1.2</span>What "SaaS" actually means for a data platform</h2>',
  '<p>"SaaS" is easy to wave past as marketing, but for a data platform it has three very concrete consequences worth internalizing, because they explain almost every design choice in the rest of this book.</p>',
  '<p><strong>1. There is no infrastructure to provision.</strong> You never create a storage account, size a Spark cluster, or choose a SQL pool\'s DWU tier. When you make a Lakehouse or a Warehouse in Fabric, the compute and storage behind it already exist and are managed for you. Compare this to Synapse (a <em>PaaS</em> — platform-as-a-service — offering) where the first thing you do is provision and scale infrastructure. In Fabric that surface is simply gone; the unit you deal with is <strong>capacity</strong>, not servers.</p>',
  '<p><strong>2. Everything is an "item" in a "workspace," governed at the tenant level.</strong> A pipeline, a notebook, a Lakehouse, a Warehouse, a semantic model, and a report are all <em>items</em> that live together in a workspace — the exact same container concept you know from Power BI, now holding every workload\'s artifacts, not just reports and datasets. Tenant-wide settings, capacity, and identity (Microsoft Entra ID) apply across all of them at once.</p>',
  '<p><strong>3. Capabilities arrive continuously.</strong> Because it\'s a service, Fabric updates itself; there are no versions to install or upgrade. The flip side, and something to hold onto for the exam and for real projects, is that features move through <strong>preview → general availability (GA)</strong> and the surface genuinely shifts over time. (This guide flags where something is in preview.)</p>',

  '<div class="cal def"><div class="cico">📘</div><div class="cbody"><div class="clab">Definition — SaaS vs PaaS</div>',
  '<p><strong>PaaS</strong> gives you managed <em>building blocks</em> you still provision, size, and connect (Azure Synapse, Azure Databricks, ADLS). <strong>SaaS</strong> gives you a finished <em>product</em> you just use; the vendor runs the infrastructure. Fabric is the SaaS successor to the PaaS analytics stack — that single distinction is the reason "no clusters, no storage accounts, just capacity and workspaces" is true.</p></div></div>',

  '<h2 data-toc="OneLake at the center"><span class="h2n">1.1.3</span>OneLake sits at the center of everything</h2>',
  '<p>If there is one idea that makes Fabric "one platform" rather than "several tools with shared billing," it is <strong>OneLake</strong>. Every Fabric tenant automatically gets exactly one OneLake — a single, organization-wide data lake, built on ADLS Gen2, that you cannot delete and never provision. Microsoft\'s own analogy is deliberate: <strong>OneLake is the "OneDrive for data"</strong> — one place, automatically there, that everything writes to and reads from.</p>',
  '<p>The pivotal design choice is that <strong>every workload stores its data in OneLake in the same open format</strong>. Spark tables, Warehouse tables, and Power BI\'s Direct Lake models all persist as <strong>Delta Parquet</strong> (with Apache <strong>Iceberg</strong> now supported too, via metadata virtualization). Because the storage format is shared and open, a table a SQL engineer creates in the Warehouse can be read by a data scientist\'s Spark notebook <em>with no export, no connector, and no second copy</em>. That is the concrete mechanism behind the phrase "one copy of data, many engines."</p>',

  '<figure><div class="figbox">'+FIG_FABRIC()+'</div><figcaption><b>Figure 1.1 — Microsoft Fabric as one SaaS platform.</b> Every workload (top) reads and writes the <em>same</em> data in OneLake (center), stored in open Delta Parquet / Iceberg on ADLS Gen2 — so there is no copying between engines. Copilot is woven through the workloads, and the whole platform runs on a single pool of Fabric capacity, with nothing to provision.</figcaption></figure>',

  '<div class="cal key"><div class="cico">🔑</div><div class="cbody"><div class="clab">Key idea</div>',
  '<p>Fabric = <strong>workloads (compute experiences) + OneLake (one shared store) + capacity (one bill)</strong>. The unification isn\'t that the tools live near each other; it\'s that they all operate on the <em>same physical data</em> in OneLake. Hold this mental model — nearly every "why does Fabric do it this way?" answer traces back to it.</p></div></div>',

  '<h2 data-toc="The workloads, briefly"><span class="h2n">1.1.4</span>The workloads, at a glance</h2>',
  '<p>Fabric groups its capabilities into <strong>workloads</strong> (you\'ll also hear "experiences"). You switch between them with the workload picker in the bottom-left of the portal, but they are not silos — they share OneLake and the same workspace. Fabric launched around a core <em>six</em>; the platform has since expanded, so the current set is broader than early write-ups suggest. The next section (1.2) treats each in depth; here is the map.</p>',
  '<div class="tablewrap"><table><thead><tr><th>Workload</th><th>What you do in it</th><th>Who lives here</th></tr></thead><tbody>',
  '<tr><td><strong>Data Factory</strong></td><td>Ingest and orchestrate — pipelines and Dataflows Gen2, 200+ connectors</td><td>Data integrators</td></tr>',
  '<tr><td><strong>Data Engineering</strong></td><td>Lakehouses, Spark notebooks, large-scale transformation</td><td>Data engineers</td></tr>',
  '<tr><td><strong>Data Warehouse</strong></td><td>A full T-SQL, transactional warehouse with separated compute/storage</td><td>SQL developers</td></tr>',
  '<tr><td><strong>Data Science</strong></td><td>Build, train and operationalize ML models; MLflow built in</td><td>Data scientists</td></tr>',
  '<tr><td><strong>Real-Time Intelligence</strong></td><td>Analyze data in motion — IoT, logs, clickstreams (KQL)</td><td>Streaming/ops analysts</td></tr>',
  '<tr><td><strong>Power BI</strong></td><td>Semantic models, reports, dashboards — the consumption layer</td><td>BI developers & analysts</td></tr>',
  '<tr><td><strong>Databases</strong></td><td>Developer-friendly transactional databases (e.g. SQL database) in Fabric</td><td>App developers</td></tr>',
  '<tr><td><strong>Industry Solutions</strong> · <strong>Fabric IQ</strong> <em>(preview)</em></td><td>Industry-specific accelerators; a unified business-semantics layer</td><td>Solution teams</td></tr>',
  '</tbody></table></div>',
  '<p>Your DP-600 path deliberately concentrates on <strong>Data Engineering, Data Warehouse, Data Factory, and Power BI</strong>, with a lighter pass over administration and governance; Real-Time Intelligence and Data Science are out of scope for this run. But knowing the whole map matters, because Fabric\'s exam questions love to test <em>which workload is the right tool</em> for a described need.</p>',

  '<h2 data-toc="Copilot & AI"><span class="h2n">1.1.5</span>AI and Copilot are woven in, not bolted on</h2>',
  '<p>Fabric ships with <strong>Copilot</strong> embedded directly inside the workloads: it can help author a notebook cell or a pipeline, generate DAX or SQL, explain code, and produce narrative summaries of a report — always within the tenant\'s data and permission boundaries, so it can\'t reach data the user can\'t. You don\'t integrate a separate AI service; it\'s part of the product. For your purposes the takeaway is modest but real: AI assistance is a first-class citizen of the platform, which is part of what "SaaS analytics platform for the AI era" is pointing at. Later workloads (like Fabric IQ) lean into giving AI a consistent semantic understanding of your business.</p>',

  '<h2 data-toc="Where Fabric came from"><span class="h2n">1.1.6</span>Where Fabric came from — and how it maps to what you know</h2>',
  '<p>Fabric is not a brand-new set of engines invented from scratch. It is the <strong>unification of three existing Microsoft products</strong> into one SaaS surface: <strong>Power BI</strong>, <strong>Azure Data Factory</strong>, and <strong>Azure Synapse Analytics</strong> (whose Spark, SQL warehousing, and real-time pieces became Fabric\'s Data Engineering, Data Warehouse, and Real-Time Intelligence workloads). Recognizing the lineage is the fastest way for an experienced practitioner to get oriented: you are meeting familiar engines wearing a SaaS coat.</p>',
  '<p>This is where your seven years of Power BI pay off immediately, because <strong>Power BI is the part of Fabric that changed least</strong>. The concepts you own already transfer one-to-one:</p>',
  '<div class="tablewrap"><table><thead><tr><th>You already know (Power BI)</th><th>In Fabric it becomes…</th></tr></thead><tbody>',
  '<tr><td>Workspaces holding reports & datasets</td><td>The <em>same</em> workspaces — now holding items from every workload</td></tr>',
  '<tr><td>Datasets</td><td><strong>Semantic models</strong> (renamed; same engine), now able to use Direct Lake</td></tr>',
  '<tr><td>Power BI Premium capacity (P SKUs)</td><td><strong>Fabric capacity (F SKUs)</strong> — one capacity powering all workloads</td></tr>',
  '<tr><td>Power Query / M in dataflows</td><td>The same Power Query engine in <strong>Dataflows Gen2</strong></td></tr>',
  '<tr><td>RLS, deployment pipelines, the admin portal</td><td>The same features, extended across Fabric items</td></tr>',
  '</tbody></table></div>',
  '<p>What is genuinely new — and where you\'ll spend most of your study energy — is everything <em>upstream</em> of the report: the Lakehouse and Delta tables, Spark notebooks, the T-SQL Warehouse as a first-class store, and above all <strong>Direct Lake</strong>, the connection mode that lets a semantic model read Delta files in OneLake directly with no import and no scheduled refresh. That single capability is the biggest re-wire from classic Power BI, and Chapter 6 is devoted to it.</p>',

  '<div class="cal warn"><div class="cico">⚠️</div><div class="cbody"><div class="clab">Common misconception</div>',
  '<p>Fabric is <strong>not</strong> "Power BI Premium with a new name," and it is <strong>not</strong> a lift-and-shift of Synapse. It reuses those engines, but the SaaS model, OneLake, and Direct Lake change how you architect solutions — you design around <em>one shared copy of data</em> and pick the right workload per task, rather than provisioning and copying between separate services. Treating it as "just rebranded Premium" is the fastest way to get scenario questions wrong.</p></div></div>',

  '<div class="cal exam"><div class="cico">📝</div><div class="cbody"><div class="clab">Exam tip — DP-600</div>',
  '<p>Expect foundational questions that reward the mental model rather than trivia: that Fabric is <strong>SaaS</strong> (no infrastructure to provision), that <strong>OneLake is one-per-tenant and stores open Delta Parquet</strong> so workloads share one copy, and that you should <strong>match a need to the right workload</strong> (ingest → Data Factory; Spark transform → Data Engineering; T-SQL warehouse → Data Warehouse; report → Power BI). If an answer option implies copying data between engines or spinning up separate infrastructure, it\'s usually the <em>wrong</em> one in Fabric.</p></div></div>',

  '<div class="refs"><h3>References — Microsoft Learn</h3><ol>',
  '<li><a href="https://learn.microsoft.com/en-us/fabric/fundamentals/microsoft-fabric-overview" target="_blank" rel="noopener">What is Microsoft Fabric?</a> — Fabric fundamentals overview (SaaS positioning, workloads, Copilot).</li>',
  '<li><a href="https://learn.microsoft.com/en-us/fabric/onelake/onelake-overview" target="_blank" rel="noopener">OneLake, the unified data lake</a> — one-per-tenant, ADLS Gen2, Delta Parquet / Iceberg, no duplication.</li>',
  '<li><a href="https://blog.fabric.microsoft.com/en-US/blog/from-azure-synapse-and-azure-data-factory-to-microsoft-fabric-the-next-gen-analytics-leap/" target="_blank" rel="noopener">From Azure Synapse and Azure Data Factory to Microsoft Fabric</a> — the product lineage (Microsoft Fabric blog).</li>',
  '<li><a href="https://learn.microsoft.com/en-us/fabric/fundamentals/fabric-trial" target="_blank" rel="noopener">Fabric trial capacity</a> — how to get a hands-on tenant to follow along.</li>',
  '<li><a href="https://learn.microsoft.com/en-us/credentials/certifications/exams/dp-600/" target="_blank" rel="noopener">Exam DP-600: Implementing Analytics Solutions Using Microsoft Fabric</a> — the official exam page & study guide.</li>',
  '</ol></div>',
  '<p class="foot-note">Sources are current Microsoft Learn documentation as of August 2026. Fabric evolves continuously — where a capability is in preview it is marked as such, and the reference links always point to the latest version.</p>'
  ].join(""); }

  function chip(x,y,l1,l2){
    var cx=x+46;
    var t1 = l2
      ? '<text x="'+cx+'" y="'+(y+22)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">'+l1+'</text><text x="'+cx+'" y="'+(y+36)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">'+l2+'</text>'
      : '<text x="'+cx+'" y="'+(y+30)+'" text-anchor="middle" font-size="10.5" font-weight="600" fill="var(--ink)">'+l1+'</text>';
    return '<rect x="'+x+'" y="'+y+'" width="92" height="48" rx="10" fill="var(--chip)" stroke="var(--line-2)"/>'+t1;
  }
  function arrow(x1,y1,x2,y2){return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="var(--ink-3)" stroke-width="1.3" marker-end="url(#ar)"/>';}
